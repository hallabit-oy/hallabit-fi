# HAL-26 v7 (27.11.2026, Kehari): HallaSport-alisivujen v7-mallin sivukohtaiset tiedot.
# Avain = sivun permalink. Kentät: tunniste (heron kategoriatunniste), johdanto (heron tiivis johdanto),
# lyhyesti (3 kohtaa tummaan LYHYESTI-kaistaan), grafiikka (_includes/hallasport_v7_grafiikat/-tiedosto, jako:
# /workspace/brandari/2026-11-27_hallasport_alisivut_hero_grafiikat_v3/00_Alikategoriajako.txt).
# Johdanto ja LYHYESTI on tiivistetty sivun omasta tekstistä (description, lead ja otsikot). Kausimaksut sellaisenaan
# Brändärin hyväksytystä mallisivusta (02_Kausimaksut_mallisivu/index.html rivit 203-205 ja 274-286).
# Sivun alkuperäinen lead säilyy artikkelitekstin ensimmäisenä kappaleena.

"/hallasport/kalenteri/":
  tunniste: "Ominaisuus · Kalenteri"
  johdanto: "Näe lasten treenit ja pelit useasta joukkueesta samassa näkymässä ja tilaa ne omaan kalenteriin."
  lyhyesti:
    - "Eri lasten ja seurojen tapahtumat kootaan perheelle samaan näkymään."
    - "Tapahtumat tunnistaa väreistä, ja ne voi tilata omaan kalenteriin."
    - "Valmentaja ylläpitää joukkueen tapahtumaa, ja perhe näkee, mitä viikko tuo tullessaan."
  grafiikka: "01_kalenteri_perhe_joukkue.svg"

