<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Juniorien peliaika">
  <style>
    @keyframes barPulse{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.92)}}.bar{transform-box:fill-box;transform-origin:left center;animation:barPulse 4.6s cubic-bezier(.23,1,.32,1) infinite}.b2{animation-delay:.35s}.b3{animation-delay:.7s}.b4{animation-delay:1.05s}.b5{animation-delay:1.4s}
    @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  </style>
<!-- Pääkortti -->
  <rect x="24" y="20" width="372" height="240" rx="16" fill="#FFFFFF" stroke="#C5D0CD" stroke-width="1.5"/>

  <!-- Otsikko ja tavoitepilleri -->
  <text x="46" y="50" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0B2A5B">Ottelun peliaika</text>
  <rect x="236" y="32" width="140" height="26" rx="13" fill="#E6F7ED" stroke="#5CCB8A" stroke-width="1.2"/>
  <circle cx="252" cy="45" r="4" fill="#0B2A5B"/>
  <text x="264" y="49" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0B2A5B">Tasainen jakauma</text>

  <!-- Pystysuorat apuviivat (0, 15, 30, 45 min) -->
  <g stroke="#EDF2F0" stroke-width="1">
    <line x1="92" y1="72" x2="92" y2="218"/>
    <line x1="182" y1="72" x2="182" y2="218"/>
    <line x1="272" y1="72" x2="272" y2="218"/>
    <line x1="362" y1="72" x2="362" y2="218"/>
  </g>

  <!-- Tavoiteviiva (31 min -> x = 278) -->
  <line x1="278" y1="70" x2="278" y2="222" stroke="#5CCB8A" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="285" y="81" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0B2A5B">Tavoite</text>

  <!-- 5 pelaajariviä, tasan 26 px askel (94, 120, 146, 172, 198) -->
  <g font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#4A5A64">
    <text x="46" y="106">#4</text>
    <rect x="92" y="94" width="270" height="16" rx="8" fill="#F1F5F3"/>
    <rect x="92" y="94" width="192" height="16" rx="8" fill="#0B2A5B"/>
    <rect x="272" y="94" width="12" height="16" rx="6" fill="#5CCB8A"/>

    <text x="46" y="132">#7</text>
    <rect x="92" y="120" width="270" height="16" rx="8" fill="#F1F5F3"/>
    <rect x="92" y="120" width="180" height="16" rx="8" fill="#0B2A5B"/>

    <text x="46" y="158">#11</text>
    <rect x="92" y="146" width="270" height="16" rx="8" fill="#F1F5F3"/>
    <rect x="92" y="146" width="186" height="16" rx="8" fill="#0B2A5B"/>
    <rect x="272" y="146" width="6" height="16" rx="3" fill="#5CCB8A"/>

    <text x="46" y="184">#14</text>
    <rect x="92" y="172" width="270" height="16" rx="8" fill="#F1F5F3"/>
    <rect x="92" y="172" width="174" height="16" rx="8" fill="#0B2A5B"/>

    <text x="46" y="210">#19</text>
    <rect x="92" y="198" width="270" height="16" rx="8" fill="#F1F5F3"/>
    <rect x="92" y="198" width="198" height="16" rx="8" fill="#0B2A5B"/>
    <rect x="272" y="198" width="18" height="16" rx="6" fill="#5CCB8A"/>
  </g>

  <!-- Asteikko alhaalla -->
  <g font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#4A5A64" text-anchor="middle">
    <text x="92" y="242">0 min</text>
    <text x="182" y="242">15 min</text>
    <text x="272" y="242">30 min</text>
    <text x="362" y="242">45 min</text>
  </g>
</svg>
