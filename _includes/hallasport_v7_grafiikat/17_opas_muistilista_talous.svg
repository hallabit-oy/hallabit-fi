    <text x="82" y="182" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0B2A5B">Kuitit ja kulukorvaukset</text>
    <text x="348" y="182" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#4A5A64" text-anchor="end">Jatkuva</text>
