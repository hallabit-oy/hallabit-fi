    <text x="82" y="102" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0B2A5B">Kauden budjetti</text>
    <text x="348" y="102" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#4A5A64" text-anchor="end">Elokuu</text>
  </g>
  <g class="row r2">
    <rect x="46" y="122" width="316" height="32" rx="8" fill="#E6F7ED"/>
    <circle cx="64" cy="138" r="9" fill="#5CCB8A"/>
    <path class="chk c2" pathLength="18" d="M60 138.2 L63 141.2 L68.5 135.2" fill="none" stroke="#0B2A5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="142" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0B2A5B">Kausimaksut ja viitteet</text>
    <text x="348" y="142" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#4A5A64" text-anchor="end">Syyskuu</text>
  </g>
