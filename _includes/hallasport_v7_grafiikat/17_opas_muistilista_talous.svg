<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Rahastonhoitajan muistilista">
  <style>
    @keyframes drawC{0%,10%{stroke-dashoffset:18}30%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:18}}.chk{stroke-dasharray:18;animation:drawC 6s cubic-bezier(.23,1,.32,1) infinite}.c2{animation-delay:.35s}.c3{animation-delay:.7s}.c4{animation-delay:1.05s}
    @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  </style>

  <rect x="26" y="20" width="356" height="236" rx="16" fill="#FFFFFF" stroke="#C5D0CD" stroke-width="1.5"/>
  <line x1="26" y1="62" x2="382" y2="62" stroke="#E4ECE9" stroke-width="1.25"/>
  <text x="46" y="46" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0B2A5B">Rahastonhoitajan muistilista</text>
  <rect x="282" y="32" width="80" height="20" rx="10" fill="#E9EFF6"/>
  <text x="322" y="46" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0B2A5B" text-anchor="middle">4 vaihetta</text>
  
  <g class="row r1">
    <rect x="46" y="82" width="316" height="32" rx="8" fill="#E6F7ED"/>
    <circle cx="64" cy="98" r="9" fill="#5CCB8A"/>
