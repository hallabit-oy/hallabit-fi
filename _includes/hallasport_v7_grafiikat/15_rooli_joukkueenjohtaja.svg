<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Joukkueenjohtajan arkinäkymä">
  <style>
    @keyframes pulseB{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}.badge{transform-box:fill-box;transform-origin:center;animation:pulseB 3.6s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  </style>

  <rect x="26" y="22" width="356" height="224" rx="16" fill="#FFFFFF" stroke="#C5D0CD" stroke-width="1.5"/>
  <line x1="26" y1="64" x2="382" y2="64" stroke="#E4ECE9" stroke-width="1.25"/>
  <text x="46" y="48" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0B2A5B">Joukkueenjohtajan viikko</text>
  <rect x="286" y="34" width="76" height="20" rx="10" fill="#E6F7ED"/>
  <text x="324" y="48" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0B2A5B" text-anchor="middle">U11 sininen</text>

  <!-- Seuraava tapahtuma -->
  <rect x="46" y="80" width="316" height="62" rx="11" fill="#0B2A5B"/>
  <text x="64" y="103" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#5CCB8A">Seuraava tapahtuma</text>
  <text x="64" y="124" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">La 11.00 Sarjaottelu · Kotihalli</text>
  <rect class="badge" x="284" y="96" width="62" height="28" rx="8" fill="#5CCB8A"/>
  <text x="315" y="114" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#0B2A5B" text-anchor="middle">15 / 16</text>

  <!-- Tiedote + vuoro -->
  <rect x="46" y="156" width="152" height="72" rx="11" fill="#F3F6F5" stroke="#C5D0CD" stroke-width="1.1"/>
  <text x="60" y="178" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0B2A5B">Tiedote lähetetty</text>
  <text x="60" y="198" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#4A5A64">Luettu 15 / 16</text>
  <rect x="60" y="208" width="120" height="6" rx="3" fill="#5CCB8A"/>

  <rect x="210" y="156" width="152" height="72" rx="11" fill="#E9EFF6" stroke="#0B2A5B" stroke-width="1.1"/>
  <text x="224" y="178" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0B2A5B">Toimitsijavuorot</text>
  <text x="224" y="198" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#4A5A64">Kello ja kirjanpito OK</text>
  <circle cx="342" cy="210" r="7" fill="#5CCB8A"/>

