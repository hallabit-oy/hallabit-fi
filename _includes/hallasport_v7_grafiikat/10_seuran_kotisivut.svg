<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Seuran kotisivut">
  <style>
    @keyframes stripeShift{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}@keyframes cardLift{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}.stripe{animation:stripeShift 5s cubic-bezier(.23,1,.32,1) infinite}.card-a{animation:cardLift 4.8s cubic-bezier(.23,1,.32,1) infinite}.card-b{animation:cardLift 4.8s cubic-bezier(.23,1,.32,1) .8s infinite}
    @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  </style>

  <!-- Kevyt selainkehys -->
  <rect x="22" y="20" width="376" height="238" rx="14" fill="#FFFFFF" stroke="#C5D0CD" stroke-width="1.5"/>
  <rect x="22" y="20" width="376" height="28" rx="14" fill="#F3F6F5"/>
  <rect x="22" y="36" width="376" height="12" fill="#F3F6F5"/>
  <line x1="22" y1="48" x2="398" y2="48" stroke="#E4ECE9" stroke-width="1.2"/>
  <circle cx="38" cy="34" r="4" fill="#C5D0CD"/>
  <circle cx="52" cy="34" r="4" fill="#C5D0CD"/>
  <circle cx="66" cy="34" r="4" fill="#C5D0CD"/>
  <rect x="132" y="27" width="156" height="14" rx="7" fill="#FFFFFF" stroke="#DCE5E2" stroke-width="1"/>
  <text x="210" y="37" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#4A5A64" text-anchor="middle">seura.hallabit.fi</text>

  <!-- Seuran tumma yläpalkki -->
  <rect x="34" y="58" width="352" height="26" rx="7" fill="#0B2A5B"/>
  <circle cx="49" cy="71" r="6" fill="#5CCB8A"/>
  <rect x="62" y="68" width="54" height="5.5" rx="2.75" fill="#FFFFFF"/>
  <rect x="332" y="64" width="44" height="14" rx="7" fill="#5CCB8A"/>

  <!-- Hero-banneri + viistokorostus -->
  <rect x="34" y="92" width="352" height="62" rx="10" fill="#13253F"/>
  <polygon class="stripe" points="262,92 318,92 288,154 232,154" fill="#5CCB8A" opacity="0.28"/>
  <polygon points="322,92 356,92 326,154 292,154" fill="#5CCB8A" opacity="0.72"/>
  <rect x="50" y="108" width="128" height="9" rx="4.5" fill="#FFFFFF"/>
  <rect x="50" y="124" width="92" height="5" rx="2.5" fill="#C5D0CD"/>
  <rect x="50" y="136" width="64" height="5" rx="2.5" fill="#5CCB8A"/>

  <!-- Seurawidgetit: Seuraava ottelu + Joukkueet -->
  <g class="card-a">
    <rect x="34" y="164" width="170" height="80" rx="10" fill="#F9FBFA" stroke="#C5D0CD" stroke-width="1.2"/>
    <rect x="34" y="164" width="170" height="4" rx="2" fill="#5CCB8A"/>
    <text x="46" y="184" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0B2A5B">Seuraava ottelu</text>
    <rect x="46" y="194" width="112" height="6" rx="3" fill="#0B2A5B"/>
    <rect x="46" y="206" width="84" height="4.5" rx="2.25" fill="#8CA0B8"/>
    <rect x="46" y="218" width="62" height="16" rx="6" fill="#0B2A5B"/>
  </g>
  <g class="card-b">
    <rect x="216" y="164" width="170" height="80" rx="10" fill="#F9FBFA" stroke="#C5D0CD" stroke-width="1.2"/>
    <text x="228" y="184" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0B2A5B">Joukkueet</text>
    <rect x="228" y="194" width="146" height="12" rx="4" fill="#E9EFF6"/>
    <rect x="228" y="211" width="146" height="12" rx="4" fill="#E6F7ED"/>
    <rect x="228" y="228" width="108" height="8" rx="4" fill="#EDF2F0"/>
  </g>

</svg>
