<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Pesäpallokenttä">
  <style>
    @keyframes ppRing{0%{transform:scale(.75);opacity:.85}75%{transform:scale(2.3);opacity:0}100%{transform:scale(2.3);opacity:0}}
    @keyframes ppBall{0%,100%{transform:translate(124.5px,183.8px)}24%{transform:translate(134.0px,133.0px)}52%{transform:translate(276.0px,154.0px)}76%{transform:translate(224.0px,88.0px)}}
    @keyframes ppBase1{0%,16%,34%,100%{opacity:.55}24%{opacity:1}}
    @keyframes ppBase2{0%,44%,62%,100%{opacity:.55}52%{opacity:1}}
    @keyframes ppBase3{0%,68%,86%,100%{opacity:.55}76%{opacity:1}}
    .pp-ring{transform-box:fill-box;transform-origin:center;animation:ppRing 3.6s cubic-bezier(.23,1,.32,1) infinite}
    .pp-ball{animation:ppBall 6.8s cubic-bezier(.23,1,.32,1) infinite}
    .pp-b1{animation:ppBase1 6.8s ease-in-out infinite}
    .pp-b2{animation:ppBase2 6.8s ease-in-out infinite}
    .pp-b3{animation:ppBase3 6.8s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  </style>

