<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Valmentajan kenttänäkymä">
  <style>
    @keyframes barB{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.92)}}.bar{transform-box:fill-box;transform-origin:left center;animation:barB 4.6s cubic-bezier(.23,1,.32,1) infinite}.b2{animation-delay:.4s}.b3{animation-delay:.8s}
    @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  </style>

  <rect x="26" y="22" width="356" height="224" rx="16" fill="#FFFFFF" stroke="#C5D0CD" stroke-width="1.5"/>
  <line x1="26" y1="64" x2="382" y2="64" stroke="#E4ECE9" stroke-width="1.25"/>
  <text x="46" y="48" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0B2A5B">Valmentajan ottelunäkymä</text>
  <rect x="276" y="34" width="86" height="20" rx="10" fill="#E6F7ED"/>
  <text x="319" y="48" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0B2A5B" text-anchor="middle">Kokoonpano OK</text>

  <!-- Läsnäolokoonti -->
  <rect x="46" y="78" width="150" height="58" rx="10" fill="#F3F6F5"/>
  <text x="60" y="98" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#4A5A64">Harjoituksissa</text>
  <text x="60" y="122" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0B2A5B">14 + 2 mv</text>

  <rect x="210" y="78" width="152" height="58" rx="10" fill="#E6F7ED"/>
  <text x="224" y="98" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#0B2A5B">Peliaikatavoite</text>
  <text x="224" y="122" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="800" fill="#0B2A5B">15 min / pelaaja</text>

  <!-- Kolmen kentän tasainen peliaika -->
  <text x="46" y="158" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4A5A64">Ketju 1</text>
  <rect class="bar b1" x="108" y="147" width="196" height="14" rx="5" fill="#0B2A5B"/>
  <text x="46" y="186" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4A5A64">Ketju 2</text>
  <rect class="bar b2" x="108" y="175" width="190" height="14" rx="5" fill="#0B2A5B"/>
  <text x="46" y="214" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4A5A64">Ketju 3</text>
  <rect class="bar b3" x="108" y="203" width="186" height="14" rx="5" fill="#5CCB8A"/>
  <line x1="296" y1="142" x2="296" y2="224" stroke="#5CCB8A" stroke-width="2" stroke-dasharray="4 3"/>

</svg>
